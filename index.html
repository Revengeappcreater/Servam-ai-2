<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mayuresh Garments</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
/* ══════════ TOKENS ══════════ */
:root {
  --navy:       #0D1B2A;
  --navy-mid:   #152236;
  --teal:       #00BFA5;
  --teal-light: #E0F7F4;
  --amber:      #F59E0B;
  --rose:       #F43F5E;
  --green:      #10B981;
  --surface:    #FFFFFF;
  --pale:       #F4F7F9;
  --pale2:      #EBF0F4;
  --border:     #E2EAF0;
  --ink:        #0D1B2A;
  --sub:        #546478;
  --muted:      #8FA3B4;
  --r-lg:       22px;
  --r-md:       16px;
  --r-pill:     50px;
  --sh-sm:      0 2px 12px rgba(13,27,42,.07);
  --sh-md:      0 6px 28px rgba(13,27,42,.12);
  --sh-lg:      0 16px 48px rgba(13,27,42,.18);
}

/* ══════════ BASE ══════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'DM Sans', sans-serif;
  background: var(--pale);
  color: var(--ink);
  overflow-x: hidden;
  max-width: 430px;
  margin: 0 auto;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
body { padding-bottom: 80px; }

/* ══════════ SCREENS ══════════ */
.screen { display: none; min-height: 100dvh; }
.screen.active { display: block; }

/* ══════════ SCROLLBAR ══════════ */
::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }

/* ══════════ TYPOGRAPHY ══════════ */
.font-serif { font-family: 'DM Serif Display', serif; }
.font-deva  { font-family: 'Noto Sans Devanagari', sans-serif; }

/* ══════════ BOTTOM NAV ══════════ */
.bnav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: none; z-index: 900;
  padding: 8px 0 14px;
  box-shadow: 0 -4px 24px rgba(13,27,42,.1);
}
.bnav.show { display: flex; }
.bni {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; padding: 4px 0;
}
.bni span { font-size: 10px; font-weight: 600; color: var(--muted); transition: color .2s; }
.bni i    { font-size: 20px; color: var(--muted); transition: all .2s; }
.bni.active i   { color: var(--teal); }
.bni.active span{ color: var(--teal); }
.bni .bdot {
  position: absolute; top: 0; right: calc(50% - 14px);
  width: 8px; height: 8px; background: var(--rose);
  border-radius: 50%; border: 2px solid white;
}

/* ══════════ TOP BAR ══════════ */
.topbar {
  position: sticky; top: 0; z-index: 200;
  background: var(--surface);
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--sh-sm);
}
.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 20px; letter-spacing: .5px; color: var(--navy);
  display: flex; align-items: center; gap: 6px;
}
.logo-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: linear-gradient(135deg, var(--teal), var(--amber));
}
.ico-btn {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--pale); border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink); font-size: 17px;
  position: relative; transition: background .2s;
}
.ico-btn:hover { background: var(--pale2); }
.ico-btn .cnt {
  position: absolute; top: -4px; right: -4px;
  background: var(--rose); color: white;
  font-size: 9px; font-weight: 700; min-width: 16px; height: 16px;
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  border: 2px solid white;
}

/* ══════════ BUTTONS ══════════ */
.btn-prim {
  background: linear-gradient(135deg, var(--navy), #1E3A5F);
  color: white; border: none; border-radius: var(--r-pill);
  padding: 15px 32px; font-family: 'DM Sans', sans-serif;
  font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all .3s; width: 100%;
  box-shadow: 0 4px 20px rgba(13,27,42,.3);
}
.btn-prim:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(13,27,42,.4); }
.btn-teal {
  background: linear-gradient(135deg, var(--teal), #00897B);
  color: white; border: none; border-radius: var(--r-pill);
  padding: 15px 32px; font-family: 'DM Sans', sans-serif;
  font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all .3s; width: 100%;
  box-shadow: 0 4px 20px rgba(0,191,165,.3);
}
.btn-outline {
  background: transparent; color: var(--navy);
  border: 2px solid var(--navy); border-radius: var(--r-pill);
  padding: 13px 32px; font-family: 'DM Sans', sans-serif;
  font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all .3s; width: 100%;
}

/* ══════════ CARDS ══════════ */
.card-base {
  background: var(--surface); border-radius: var(--r-lg);
  box-shadow: var(--sh-sm); overflow: hidden;
}

/* ══════════ BADGES ══════════ */
.badge-pill {
  display: inline-block; padding: 3px 10px; border-radius: 50px;
  font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
}
.bp-teal   { background: var(--teal-light); color: var(--teal); }
.bp-rose   { background: #FFF1F3; color: var(--rose); }
.bp-amber  { background: #FFFBEB; color: var(--amber); }
.bp-navy   { background: var(--navy); color: white; }
.bp-green  { background: #ECFDF5; color: var(--green); }

/* ══════════ INPUT ══════════ */
.inp {
  width: 100%; padding: 14px 18px;
  background: var(--pale); border: 2px solid transparent;
  border-radius: 14px; font-family: 'DM Sans', sans-serif;
  font-size: 15px; color: var(--ink); outline: none; transition: border-color .2s;
}
.inp:focus { border-color: var(--teal); background: white; }
.inp-label { font-size: 12px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

/* ══════════ SECTION HEADERS ══════════ */
.sec-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px 14px;
}
.sec-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--navy); }
.sec-link  { font-size: 13px; font-weight: 600; color: var(--teal); cursor: pointer; }

/* ══════════ TOAST ══════════ */
.toast-box {
  position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
  z-index: 999; width: 90%; max-width: 380px;
}
.toast-item {
  background: var(--navy); color: white; border-radius: 14px;
  padding: 13px 16px; font-size: 14px; font-weight: 500;
  display: flex; align-items: center; gap: 10px;
  animation: slideUp .3s ease; margin-top: 8px;
  box-shadow: var(--sh-lg);
}
@keyframes slideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
.toast-item i { font-size: 17px; }
.ti-green i { color: var(--green); }
.ti-teal  i { color: var(--teal); }
.ti-amber i { color: var(--amber); }

/* ══════════ DRAWER OVERLAY ══════════ */
.overlay {
  position: fixed; inset: 0; background: rgba(13,27,42,.5);
  backdrop-filter: blur(4px); z-index: 600; display: none;
}
.overlay.show { display: block; }
.drawer {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
  width: 100%; max-width: 430px;
  background: var(--surface); border-radius: 28px 28px 0 0; z-index: 601;
  padding: 20px 20px 48px; transition: transform .35s cubic-bezier(.4,0,.2,1);
  max-height: 90dvh; overflow-y: auto;
}
.drawer.open { transform: translateX(-50%) translateY(0); }
.drawer-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }

/* ══════════════════════════════
   SCREEN: AUTH
══════════════════════════════ */
#s-auth {
  background: var(--navy);
  display: flex; flex-direction: column;
}
.auth-top {
  flex: 1; padding: 60px 28px 40px;
  display: flex; flex-direction: column; justify-content: flex-end;
  position: relative; overflow: hidden;
}
.auth-top::before {
  content: '';
  position: absolute; top: -100px; right: -100px;
  width: 320px; height: 320px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,191,165,.2) 0%, transparent 70%);
}
.auth-top::after {
  content: '';
  position: absolute; bottom: -40px; left: -60px;
  width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle, rgba(245,158,11,.15) 0%, transparent 70%);
}
.auth-brand-tag {
  display: inline-block; border: 1px solid rgba(0,191,165,.4);
  background: rgba(0,191,165,.1); border-radius: 50px;
  padding: 5px 16px; font-size: 11px; font-weight: 600; letter-spacing: 2px;
  color: var(--teal); text-transform: uppercase; margin-bottom: 20px;
  width: fit-content; position: relative; z-index: 1;
}
.auth-headline {
  font-family: 'DM Serif Display', serif;
  font-size: 48px; color: white; line-height: 1.1; margin-bottom: 12px;
  position: relative; z-index: 1;
}
.auth-headline em { color: var(--teal); font-style: normal; }
.auth-sub { font-size: 14px; color: rgba(255,255,255,.45); line-height: 1.7; position: relative; z-index: 1; }
.auth-sheet {
  background: var(--surface); border-radius: 32px 32px 0 0;
  padding: 32px 28px 48px;
}
.auth-tabs { display: flex; background: var(--pale); border-radius: 50px; padding: 4px; margin-bottom: 28px; gap: 0; }
.auth-tab {
  flex: 1; padding: 10px; text-align: center; border-radius: 50px;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all .25s; color: var(--muted);
}
.auth-tab.active { background: var(--navy); color: white; }
.auth-divider { text-align: center; font-size: 13px; color: var(--muted); margin: 20px 0; position: relative; }
.auth-divider::before, .auth-divider::after { content: ''; position: absolute; top: 50%; width: calc(50% - 28px); height: 1px; background: var(--border); }
.auth-divider::before { left: 0; } .auth-divider::after { right: 0; }
.social-row { display: flex; gap: 12px; }
.soc-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 2px solid var(--border); border-radius: 14px; padding: 12px;
  font-size: 13px; font-weight: 600; cursor: pointer; background: white;
  color: var(--ink); transition: all .2s;
}
.soc-btn:hover { border-color: var(--teal); }

/* ══════════════════════════════
   SCREEN: HOME
══════════════════════════════ */
#s-home { background: var(--pale); }
.home-top { padding: 18px 18px 12px; }
.home-greet { font-size: 13px; color: var(--muted); margin-bottom: 3px; }
.home-name  { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--navy); }

/* Search */
.search-wrap {
  margin: 0 18px 18px; display: flex; gap: 10px; align-items: center;
  background: white; border-radius: 14px; padding: 0 16px;
  box-shadow: var(--sh-sm);
}
.search-wrap input {
  flex: 1; padding: 13px 0; background: none; border: none;
  font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--ink); outline: none;
}
.search-wrap i { color: var(--muted); font-size: 16px; }
.search-filter-btn {
  background: var(--navy); color: white; border: none; border-radius: 10px;
  width: 36px; height: 36px; flex-shrink: 0; cursor: pointer; font-size: 14px;
}

/* Flash Sale Bar */
.flash-bar {
  margin: 0 18px 18px;
  background: linear-gradient(135deg, var(--navy), #1E3A5F);
  border-radius: 14px; padding: 12px 16px;
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  position: relative; overflow: hidden;
}
.flash-bar::before {
  content: ''; position: absolute; right: -20px; top: -20px;
  width: 80px; height: 80px; border-radius: 50%; background: rgba(0,191,165,.15);
}
.flash-icon { font-size: 24px; }
.flash-text h5 { font-size: 13px; font-weight: 700; color: white; margin-bottom: 2px; }
.flash-text p  { font-size: 11px; color: rgba(255,255,255,.55); }
.flash-timer {
  margin-left: auto; background: var(--teal); border-radius: 8px;
  padding: 4px 10px; font-size: 12px; font-weight: 700; color: white;
  font-variant-numeric: tabular-nums;
}

/* Hero Carousel */
.hero-carousel { margin: 0 18px 22px; position: relative; border-radius: 22px; overflow: hidden; height: 210px; }
.hero-slide {
  position: absolute; inset: 0; display: none;
  padding: 24px; flex-direction: column; justify-content: flex-end;
}
.hero-slide.active { display: flex; }
.h-s1 { background: linear-gradient(135deg, #0D1B2A 0%, #1E3A5F 50%, #00796B 100%); }
.h-s2 { background: linear-gradient(135deg, #1A0533 0%, #4A1060 60%, #F43F5E 100%); }
.h-s3 { background: linear-gradient(135deg, #2D1A00 0%, #6B3A00 60%, #F59E0B 100%); }
.hero-badge {
  display: inline-block; background: rgba(255,255,255,.18); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,.3); border-radius: 50px;
  padding: 4px 12px; font-size: 10px; font-weight: 700; letter-spacing: 2px;
  color: white; text-transform: uppercase; margin-bottom: 10px; width: fit-content;
}
.hero-slide h2 { font-family: 'DM Serif Display', serif; font-size: 28px; color: white; line-height: 1.1; margin-bottom: 6px; }
.hero-slide p  { font-size: 12px; color: rgba(255,255,255,.6); margin-bottom: 14px; }
.hero-cta {
  background: white; color: var(--navy); border: none; border-radius: 50px;
  padding: 8px 20px; font-size: 12px; font-weight: 700; cursor: pointer; width: fit-content;
}
.hero-emoji { position: absolute; right: 10px; top: 10px; font-size: 80px; opacity: .25; }
.hero-dots { position: absolute; bottom: 14px; right: 14px; display: flex; gap: 5px; }
.hdot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.4); cursor: pointer; transition: all .2s; }
.hdot.active { background: white; width: 18px; border-radius: 3px; }

/* Limited Edition Alert */
.ltd-alert {
  margin: 0 18px 20px; border-radius: 14px; overflow: hidden;
  border: 1.5px solid rgba(244,63,94,.3); background: linear-gradient(135deg, rgba(244,63,94,.05), rgba(244,63,94,.02));
  padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer;
}
.ltd-pulse {
  width: 10px; height: 10px; border-radius: 50%; background: var(--rose);
  flex-shrink: 0; animation: pulse-ring 1.5s infinite;
}
@keyframes pulse-ring { 0%,100% { box-shadow: 0 0 0 0 rgba(244,63,94,.4); } 50% { box-shadow: 0 0 0 8px rgba(244,63,94,0); } }

/* Categories */
.cats-scroll { display: flex; gap: 12px; padding: 0 18px 20px; overflow-x: auto; }
.cat-item { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.cat-icon-box {
  width: 64px; height: 64px; border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; transition: transform .2s; border: 2px solid transparent;
}
.cat-item.active .cat-icon-box { border-color: var(--teal); }
.cat-item.active .cat-lbl { color: var(--teal); font-weight: 700; }
.cat-lbl { font-size: 11px; color: var(--muted); font-weight: 500; }
.ci-1 { background: linear-gradient(135deg, #E0F7F4, #B2DFDB); }
.ci-2 { background: linear-gradient(135deg, #FFF3E0, #FFE0B2); }
.ci-3 { background: linear-gradient(135deg, #F3E5F5, #E1BEE7); }
.ci-4 { background: linear-gradient(135deg, #E3F2FD, #BBDEFB); }
.ci-5 { background: linear-gradient(135deg, #F1F8E9, #DCEDC8); }
.ci-6 { background: linear-gradient(135deg, #FBE9E7, #FFCCBC); }

/* Products Grid */
.prods-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 18px 20px; }
.prod-card {
  background: white; border-radius: var(--r-lg); overflow: hidden;
  box-shadow: var(--sh-sm); cursor: pointer; transition: transform .25s, box-shadow .25s;
}
.prod-card:hover { transform: translateY(-3px); box-shadow: var(--sh-md); }
.prod-img {
  height: 190px; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.prod-emoji { font-size: 72px; transition: transform .3s; }
.prod-card:hover .prod-emoji { transform: scale(1.08); }
.prod-bdg { position: absolute; top: 10px; left: 10px; }
.wish-btn {
  position: absolute; top: 8px; right: 8px;
  background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
  border: none; width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 14px; color: var(--muted); transition: all .2s;
}
.wish-btn.on { color: var(--rose); }
.compare-cb {
  position: absolute; bottom: 8px; left: 8px;
  width: 20px; height: 20px; border-radius: 6px; cursor: pointer;
  border: 2px solid rgba(255,255,255,.7); background: rgba(255,255,255,.4);
  display: flex; align-items: center; justify-content: center; font-size: 10px; color: white;
}
.compare-cb.on { background: var(--teal); border-color: var(--teal); }
.prod-info { padding: 12px 14px 14px; }
.prod-brand { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
.prod-name  { font-size: 13px; font-weight: 600; color: var(--navy); line-height: 1.3; margin-bottom: 6px; }
.prod-rating { display: flex; align-items: center; gap: 3px; margin-bottom: 5px; }
.prod-rating i { font-size: 10px; color: var(--amber); }
.prod-rating span { font-size: 10px; color: var(--muted); }
.prod-price { display: flex; align-items: center; gap: 6px; }
.pp-cur  { font-size: 15px; font-weight: 700; color: var(--navy); }
.pp-orig { font-size: 12px; color: var(--muted); text-decoration: line-through; }
.pp-off  { font-size: 10px; font-weight: 700; color: var(--green); }

/* Bestsellers strip */
.bs-scroll { display: flex; gap: 14px; padding: 0 18px 20px; overflow-x: auto; }
.bs-card {
  flex-shrink: 0; width: 140px; background: white;
  border-radius: 18px; overflow: hidden; box-shadow: var(--sh-sm); cursor: pointer;
}
.bs-img { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 52px; }
.bs-info { padding: 10px 12px 12px; }
.bs-name { font-size: 12px; font-weight: 600; color: var(--navy); margin-bottom: 3px; line-height: 1.3; }
.bs-price { font-size: 13px; font-weight: 700; color: var(--teal); }

/* Loyalty */
.loyalty-card {
  margin: 0 18px 20px; border-radius: 22px;
  background: linear-gradient(135deg, var(--navy) 0%, #1E3A5F 100%);
  padding: 22px; position: relative; overflow: hidden; cursor: pointer;
}
.loyalty-card::after {
  content: ''; position: absolute; right: -30px; top: -30px;
  width: 160px; height: 160px; border-radius: 50%; background: rgba(0,191,165,.12);
}
.loyalty-pts { font-family: 'DM Serif Display', serif; font-size: 40px; color: var(--teal); line-height: 1; }
.loyalty-lbl { font-size: 12px; color: rgba(255,255,255,.5); margin-bottom: 12px; }
.loyalty-bar { height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; margin-bottom: 6px; }
.loyalty-fill { height: 6px; background: linear-gradient(90deg, var(--teal), var(--amber)); border-radius: 3px; width: 60%; }
.loyalty-tip  { font-size: 12px; color: rgba(255,255,255,.5); }

/* ══════════════════════════════
   SCREEN: CATALOG
══════════════════════════════ */
#s-catalog { background: var(--pale); }
.chips-scroll { display: flex; gap: 8px; padding: 12px 18px; overflow-x: auto; }
.chip {
  flex-shrink: 0; padding: 7px 16px; border-radius: 50px;
  border: 1.5px solid var(--border); background: white;
  font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer; transition: all .2s;
  white-space: nowrap;
}
.chip.active { background: var(--navy); color: white; border-color: var(--navy); }
.catalog-meta { display: flex; align-items: center; justify-content: space-between; padding: 0 18px 12px; }
.catalog-meta span { font-size: 13px; color: var(--muted); }
.sort-btn { font-size: 13px; font-weight: 600; color: var(--teal); cursor
